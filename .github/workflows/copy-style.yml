name: Copy style
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  punctuation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check original Markdown copy
        shell: bash
        run: |
          status=0
          while IFS= read -r -d '' file; do
            if grep -nEi '—|&mdash;|&#0*8212;|&#x0*2014;' "$file"; then
              echo "Replace em dashes in $file with a full stop, comma or parentheses."
              status=1
            fi
          done < <(git ls-files -z '*.md')
          exit "$status"
